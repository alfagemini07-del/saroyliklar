<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Saroylik bozori</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/css/webapp.css?v=8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="access-gate" id="access-gate">
    <div>
      <span class="access-gate-icon"><i data-lucide="shield-check"></i></span>
      <h1 id="access-gate-title">Telegram sessiyasi tekshirilmoqda</h1>
      <p id="access-gate-text">Xavfsiz kirish tayyorlanmoqda.</p>
    </div>
  </div>
  <div class="app-shell" id="app-shell" hidden>
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-mark">S</div>
        <div class="brand-copy">
          <strong>Saroylik bozori</strong>
          <span>Mahalliy do'konlar marketplace'i</span>
        </div>
        <button class="icon-button" id="header-locate" type="button" aria-label="Joylashuvim" title="Joylashuvim">
          <i data-lucide="locate-fixed"></i>
        </button>
      </div>
      <label class="search-box" id="search-wrap">
        <i data-lucide="search"></i>
        <input id="search-input" type="search" placeholder="Mahsulot yoki do'kon qidiring" autocomplete="off">
        <button id="clear-search" type="button" aria-label="Qidiruvni tozalash"><i data-lucide="x"></i></button>
      </label>
    </header>

    <main class="main-content">
      <section class="view active" id="home-view" aria-label="Bosh sahifa">
        <div class="category-rail" id="category-rail"></div>
        <div class="section-heading">
          <div><span class="eyebrow">Mahallangizda</span><h1>Yangi mahsulotlar</h1></div>
          <span id="product-count"></span>
        </div>
        <div class="product-grid" id="product-grid"></div>
        <button class="load-more" id="load-more" type="button">Yana ko'rsatish</button>
      </section>

      <section class="view" id="stores-view" aria-label="Do'konlar">
        <div class="page-heading"><span class="eyebrow">Mahalliy biznes</span><h1>Do'konlar</h1></div>
        <div class="store-list" id="store-list"></div>
      </section>

      <section class="view map-view" id="map-view" aria-label="Xarita">
        <div id="market-map"></div>
        <div class="map-filter" id="map-filter"></div>
        <div class="map-status" id="map-status">Do'konlar yuklanmoqda</div>
        <button class="map-action" id="map-locate" type="button" aria-label="Joylashuvim"><i data-lucide="navigation"></i></button>
        <div class="map-preview" id="map-preview" hidden></div>
      </section>

      <section class="view" id="profile-view" aria-label="Profil">
        <div id="profile-content"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Asosiy menyu">
      <button class="active" data-view="home" type="button"><i data-lucide="house"></i><span>Bosh sahifa</span></button>
      <button data-view="stores" type="button"><i data-lucide="store"></i><span>Do'konlar</span></button>
      <button class="create-button" id="open-compose" type="button" aria-label="Do'kon yoki mahsulot qo'shish"><i data-lucide="plus"></i></button>
      <button data-view="map" type="button"><i data-lucide="map"></i><span>Xarita</span></button>
      <button data-view="profile" type="button"><i data-lucide="user-round"></i><span>Profil</span></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <aside class="detail-sheet" id="detail-sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <button class="sheet-close icon-button" type="button" aria-label="Yopish"><i data-lucide="x"></i></button>
    <div id="detail-content"></div>
  </aside>

  <div class="modal" id="compose-modal" aria-hidden="true">
    <div class="modal-header">
      <button class="icon-button modal-close" type="button" aria-label="Yopish"><i data-lucide="x"></i></button>
      <strong id="compose-title">Do'kon ochish</strong>
      <span class="modal-spacer"></span>
    </div>

    <form class="compose-form" id="store-form" enctype="multipart/form-data">
      <input name="mode" type="hidden" value="create">
      <div class="form-section-title"><i data-lucide="store"></i><span>Do'kon ma'lumotlari</span></div>
      <label><span>Do'kon nomi</span><input name="name" required minlength="2" maxlength="150" placeholder="Masalan, Baraka market"></label>
      <label><span>Faoliyat turi</span><select name="category" class="category-select"></select></label>
      <label><span>Do'kon haqida</span><textarea name="description" rows="3" maxlength="4000" placeholder="Nimalar sotasiz yoki qanday xizmat ko'rsatasiz?"></textarea></label>
      <div class="form-row">
        <label><span>Telefon</span><input name="phone" required inputmode="tel" placeholder="+998 ..."></label>
        <label><span>Ish vaqti</span><input name="working_hours" placeholder="09:00 - 21:00"></label>
      </div>
      <label><span>Manzil</span><input name="address" required maxlength="255" placeholder="Ko'cha, uy va mo'ljal"></label>
      <button class="location-field" data-location-form="store" type="button"><i data-lucide="map-pin"></i><span>Do'konni xaritada belgilang</span><i data-lucide="chevron-right"></i></button>
      <input name="lat" type="hidden"><input name="lng" type="hidden">
      <div class="form-row">
        <label><span>Telegram</span><input name="telegram" placeholder="@username"></label>
        <label><span>Instagram</span><input name="instagram" placeholder="username"></label>
      </div>
      <label><span>Veb-sayt</span><input name="website" type="url" placeholder="https://..."></label>
      <div class="media-fields">
        <label class="media-input compact"><input name="avatar" type="file" accept="image/jpeg,image/png,image/webp"><i data-lucide="camera"></i><span>Logo</span><small>Kvadrat rasm</small></label>
        <label class="media-input compact"><input name="cover" type="file" accept="image/jpeg,image/png,image/webp"><i data-lucide="image-plus"></i><span>Muqova</span><small>Keng rasm</small></label>
      </div>
      <div class="media-preview"></div>
      <button class="primary-button submit-button" type="submit">Do'konni yuborish</button>
    </form>

    <form class="compose-form" id="product-form" enctype="multipart/form-data" hidden>
      <input name="product_id" type="hidden">
      <label class="media-input" id="product-media-field"><input name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"><i data-lucide="image-plus"></i><span>Mahsulot rasmi yoki videosi</span><small>10 MB gacha</small></label>
      <div class="media-preview"></div>
      <label><span>Mahsulot nomi</span><input name="title" required minlength="2" maxlength="160" placeholder="Masalan, Uy yog'i 1 litr"></label>
      <label><span>Tavsif</span><textarea name="description" rows="3" maxlength="2000" placeholder="Mahsulot haqida qisqa ma'lumot"></textarea></label>
      <div class="form-row">
        <label><span>Narx</span><input name="price" inputmode="decimal" placeholder="Kelishiladi"></label>
        <label><span>Valyuta</span><select name="currency"><option>UZS</option><option>USD</option></select></label>
      </div>
      <label class="availability-field" id="availability-field" hidden><input name="is_available" type="checkbox" checked><span>Sotuvda mavjud</span></label>
      <button class="primary-button submit-button" type="submit">Mahsulotni qo'shish</button>
    </form>
  </div>

  <div class="modal map-picker" id="map-picker" aria-hidden="true">
    <div class="modal-header">
      <button class="icon-button picker-close" type="button" aria-label="Yopish"><i data-lucide="x"></i></button>
      <strong>Do'kon joylashuvi</strong>
      <button class="text-button" id="confirm-location" type="button">Tayyor</button>
    </div>
    <div class="picker-map-wrap">
      <div id="picker-map"></div>
      <div class="center-pin"><i data-lucide="map-pin"></i></div>
      <button class="map-action" id="picker-locate" type="button" aria-label="Joylashuvim"><i data-lucide="locate-fixed"></i></button>
    </div>
    <div class="coordinate-bar" id="coordinate-bar">Xaritani siljiting</div>
  </div>

  <div class="media-viewer" id="media-viewer" hidden aria-hidden="true">
    <div class="media-viewer-header">
      <strong id="media-viewer-title">Mahsulot rasmi</strong>
      <button class="viewer-icon-button" id="media-viewer-close" type="button" aria-label="Yopish"><i data-lucide="x"></i></button>
    </div>
    <div class="media-viewer-stage" id="media-viewer-stage">
      <div id="media-viewer-content"></div>
    </div>
    <div class="media-viewer-tools" id="media-viewer-tools">
      <button type="button" data-viewer-zoom="out" aria-label="Kichraytirish"><i data-lucide="zoom-out"></i></button>
      <button type="button" data-viewer-zoom="reset" aria-label="Asl o'lcham"><i data-lucide="scan"></i></button>
      <button type="button" data-viewer-zoom="in" aria-label="Kattalashtirish"><i data-lucide="zoom-in"></i></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/static/js/webapp-v4.js?v=8" defer></script>
</body>
</html>
